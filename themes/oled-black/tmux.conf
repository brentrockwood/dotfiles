# OLED theme: keep inactive terminal surfaces fully black.
set -g status-style "bg=#000000 fg=#839496"
set -g status-left "#[fg=#268bd2,bold] ❐ #S #[fg=#839496]⌂ #{b:pane_current_path}"
set -g status-right "#[fg=#839496]%H:%M  %d %b #[fg=#268bd2,bold]#h "
set -g window-status-style "bg=#000000 fg=#586e75"
set -g window-status-format " #I: #W "
set -g window-status-current-style "bg=#000000 fg=#268bd2 bold"
set -g window-status-current-format " #I: #W#{?window_zoomed_flag, ✦,} "
set -g window-status-separator ""
set -g pane-border-style "fg=#586e75 bg=#000000"
set -g pane-active-border-style "fg=#006600 bg=#000000"
set -g message-style "bg=#000000 fg=#839496"
set -g message-command-style "bg=#000000 fg=#268bd2"
set -g mode-style "bg=#268bd2 fg=#000000 bold"
