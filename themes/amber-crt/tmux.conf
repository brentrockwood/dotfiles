# Amber CRT theme: warm phosphor text over dark glass.
set -g status-style "bg=#000000 fg=#d69200"
set -g status-left "#[fg=#ffb000,bold] ❐ #S #[fg=#d69200]⌂ #{b:pane_current_path}"
set -g status-right "#[fg=#d69200]%H:%M  %d %b #[fg=#ffb000,bold]#h "
set -g window-status-style "bg=#100a00 fg=#805000"
set -g window-status-format " #I: #W "
set -g window-status-current-style "bg=#100a00 fg=#ffcf70 bold"
set -g window-status-current-format " #I: #W#{?window_zoomed_flag, ✦,} "
set -g window-status-separator ""
set -g pane-border-style "fg=#805000 bg=#100a00"
set -g pane-active-border-style "fg=#ffb000 bg=#100a00"
set -g message-style "bg=#1a1000 fg=#ffcf70"
set -g message-command-style "bg=#1a1000 fg=#ffb000"
set -g mode-style "bg=#ffb000 fg=#100a00 bold"
